function banner(x,y,z,label){const g=new THREE.Group();const cloth=new THREE.Mesh(new THREE.PlaneGeometry(5.2,9),new THREE.MeshStandardMaterial({color:'#781c2b',side:THREE.DoubleSide,roughness:1}));g.add(cloth);const stripe=new THREE.Mesh(new THREE.PlaneGeometry(4.4,.18),new THREE.MeshBasicMaterial({color:'#d6aa61',side:THREE.DoubleSide}));stripe.position.z=.02;stripe.position.y=3.7;g.add(stripe);const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;let c=canvas.getContext('2d');c.fillStyle='#f3d6a1';c.textAlign='center';c.font='bold 45px Georgia';label.split('|').forEach((s,i)=>c.fillText(s,256,160+i*70));const t=new THREE.CanvasTexture(canvas);const text=new THREE.Mesh(new THREE.PlaneGeometry(5.1,5.1),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide}));text.position.z=.05;g.add(text);g.position.set(x,y,z);scene.add(g)}banner(-27,13,-29.8,'JUJITSU|VIRTUAL');banner(27,13,-29.8,'CASSANO|TEAM');banner(-38.7,13,-8,'DOJO|KOI');banner(38.7,13,-8,'VALMONTONE|VERSE');

const fighter=new THREE.Group();scene.add(fighter);const skin=mat('#c78d69'),gi=mat('#e6e1d8'),hair=mat('#30231f'),belt=mat('#151315');function part(parent,geometry,material,x,y,z){let m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}part(fighter,new THREE.CapsuleGeometry(.76,1.35,5,10),gi,0,2.8,0);part(fighter,new THREE.SphereGeometry(.51,12,10),skin,0,4.5,0);part(fighter,new THREE.SphereGeometry(.54,12,10),hair,0,4.84,-.08);part(fighter,new THREE.BoxGeometry(1.55,.22,.95),belt,0,2.17,0);for(let s of [-1,1]){let leg=part(fighter,new THREE.CapsuleGeometry(.32,1.45,4,8),gi,s*.42,.94,0);leg.name='leg';leg.userData.side=s;let arm=part(fighter,new THREE.CapsuleGeometry(.26,1.12,4,8),gi,s*1.05,2.8,0);arm.rotation.z=s*.25;arm.name='arm';arm.userData.side=s;part(fighter,new THREE.BoxGeometry(.42,.13,.14),dark,s*.24,4.54,.45)}fighter.position.set(0,.35,0);
// camera orbit / touch
let az=.52,el=.42,dist=57,target=new THREE.Vector3(0,3,0),drag=false,lastX=0,lastY=0,mode=0,playing=false,bow=0;const keys=new Set();function updateCam(){const d=dist*Math.cos(el);camera.position.set(target.x+Math.sin(az)*d,target.y+Math.sin(el)*dist,target.z+Math.cos(az)*d);camera.lookAt(target)}updateCam();const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-lastX)*.006;el=Math.max(.12,Math.min(1.25,el+(e.clientY-lastY)*.005));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('wheel',e=>{dist=Math.max(12,Math.min(90,dist+e.deltaY*.04));e.preventDefault()},{passive:false});let pinch=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dd=Math.hypot(dx,dy);if(pinch)dist=Math.max(12,Math.min(90,dist+(pinch-dd)*.1));pinch=dd;}},{passive:true});canvas.addEventListener('touchend',()=>pinch=0);
const map={up:'ArrowUp',down:'ArrowDown',left:'ArrowLeft',right:'ArrowRight'};for(let id of Object.keys(map)){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(map[id]);b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(map[id]))}window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase()==='w'?'ArrowUp':e.key.toLowerCase()==='s'?'ArrowDown':e.key.toLowerCase()==='a'?'ArrowLeft':e.key.toLowerCase()==='d'?'ArrowRight':e.key)});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()==='w'?'ArrowUp':e.key.toLowerCase()==='s'?'ArrowDown':e.key.toLowerCase()==='a'?'ArrowLeft':e.key.toLowerCase()==='d'?'ArrowRight':e.key));$('camera').onclick=()=>{mode=(mode+1)%3;dist=[57,30,17][mode];el=[.42,.25,.3][mode];target.set(fighter.position.x,3,fighter.position.z)};$('walk').onclick=()=>{playing=!playing;$('walk').textContent=playing?'PAUSA':'GIOCA';$('status').textContent=playing?'Modalità prova · muovi il judoka':'Arena 3D · modalità esplorazione'};$('bow').onclick=()=>{bow=1.5};$('reset').onclick=()=>{fighter.position.set(0,.35,0);fighter.rotation.set(0,0,0);az=.52;el=.42;dist=57;target.set(0,3,0);playing=false;$('walk').textContent='GIOCA';$('status').textContent='Arena 3D · modalità esplorazione'};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;let dx=0,dz=0;if(playing){if(keys.has('ArrowUp'))dz=-1;if(keys.has('ArrowDown'))dz=1;if(keys.has('ArrowLeft'))dx=-1;if(keys.has('ArrowRight'))dx=1;let n=Math.hypot(dx,dz);if(n){dx/=n;dz/=n;fighter.position.x=THREE.MathUtils.clamp(fighter.position.x+dx*dt*6,-14.1,14.1);fighter.position.z=THREE.MathUtils.clamp(fighter.position.z+dz*dt*6,-10.1,10.1);fighter.rotation.y=Math.atan2(-dx,-dz);fighter.position.y=.35+Math.abs(Math.sin(time*10))*.1;for(let child of fighter.children){if(child.name==='leg')child.rotation.x=Math.sin(time*10)*.25*child.userData.side}}else{fighter.position.y=.35;for(let child of fighter.children){if(child.name==='leg')child.rotation.x=0}}}if(bow>0){bow-=dt;fighter.rotation.x=Math.sin(Math.PI*(1-bow/1.5))*.42}else fighter.rotation.x=0;for(let i=0;i<flames.length;i++){let f=flames[i];f.scale.y=.8+.2*Math.sin(time*9+i);f.rotation.y=time*.6}if(mode===2)target.lerp(new THREE.Vector3(fighter.position.x,2.6,fighter.position.z),.06);updateCam();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('loading').remove();
